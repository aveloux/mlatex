# Publishes a release for a pushed tag `v*`: build.yml builds, tests and
# packages it in this same run, so what is published is what was tested.
# Every package is attached to a GitHub release, and then the WebAssembly
# module goes to npm and the Python wheels to PyPI, both as mlatex, versioned
# as the tag is.
name: Publish

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: bin/*
          generate_release_notes: true

  # The token is an npm access token allowed to publish mlatex, kept as the
  # repository's NPM_TOKEN secret; provenance ties the package to this run.
  npm:
    name: npm
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mlatex-wasm
          path: bin

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish bin/mlatex-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Through PyPI's trusted publishing, for this workflow and the `pypi`
  # environment. Allowed to fail on its own: until PyPI's mlatex belongs to
  # this project, PyPI refuses the upload, and the release and npm stand
  # without it.
  pypi:
    name: PyPI
    needs: release
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mlatex-*-*
          path: bin
          merge-multiple: true

      - name: Keep the wheels
        run: mkdir dist && mv bin/*.whl dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
