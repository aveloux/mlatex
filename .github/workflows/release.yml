# Ships what Build made once it has passed on main with a VERSION not yet
# released: the tag and a GitHub release with every package, then the npm
# package -- mlatex on npm, @modern-latex/mlatex on GitHub Packages -- and the
# Python wheels; and the docs site is told. Build packed and tested them in its own
# run, versioned as VERSION says, so what is published is what passed, and a
# new version is VERSION changed on main. A tag pushed by hand releases the
# same way when it is VERSION's own.
#
# Each place is published to once: a run finds what is there already and
# ships only the rest, so a step that failed is retried by running this
# workflow again for the same Build run, from the Actions tab or with
#   gh workflow run release.yml -f run=<the Build run's id>
name: Release

on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      run:
        description: The Build run whose packages to ship
        required: true

# One release at a time: a second run for the same version finds it shipped.
concurrency:
  group: release

permissions:
  contents: read
  actions: read

jobs:
  # The version is VERSION's at the commit Build ran on -- or the tag's, for
  # a tag pushed before the file existed; main before it ships nothing. A tag
  # that is not VERSION's own, or a tag already on another commit, ships
  # nothing either.
  version:
    name: Version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      commit: ${{ steps.decide.outputs.commit }}
      version: ${{ steps.decide.outputs.version }}
      title: ${{ steps.decide.outputs.title }}
      ship: ${{ steps.decide.outputs.ship }}
      github: ${{ steps.decide.outputs.github }}
      npm: ${{ steps.decide.outputs.npm }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run || github.event.workflow_run.id }}
        run: |
          read -r commit branch conclusion event < <(gh run view "$RUN" -R "$GITHUB_REPOSITORY" \
            --json headSha,headBranch,conclusion,event --jq '"\(.headSha) \(.headBranch) \(.conclusion) \(.event)"')
          file=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$commit" --jq .content 2> /dev/null |
            base64 -d 2> /dev/null | tr -d '\r') || file=""
          version=$(printf '%s\n' "$file" | sed -n 1p | tr -d '[:space:]')
          title=$(printf '%s\n' "$file" | sed -n 2p | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          [ -n "$version" ] || version="${branch#v}"
          tag="v$version"
          ship=false
          github=false
          npm=false
          if [ "$conclusion" != success ] || [ "$event" != push ]; then
            echo "::notice::Build run $RUN did not pass on a push, so nothing is shipped."
          elif [ "$branch" = main ] && [ "$version" = main ]; then
            echo "::notice::This commit has no VERSION, so nothing is shipped."
          elif [ "$branch" != main ] && [ "$branch" != "$tag" ]; then
            echo "::notice::The tag $branch is not VERSION's $tag, so nothing is shipped."
          elif tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2> /dev/null) &&
              [ "$tagged" != "$commit" ]; then
            echo "::warning::$tag already names $tagged, not $commit: raise VERSION to release this commit."
          else
            ship=true
            gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || github=true
            npm view "mlatex@$version" version > /dev/null 2>&1 || npm=true
          fi
          echo "Build run $RUN, $commit: version $version, \"$title\"; shipped: $ship; GitHub release to make: $github; npm to publish: $npm"
          {
            echo "run=$RUN"
            echo "commit=$commit"
            echo "version=$version"
            echo "title=$title"
            echo "ship=$ship"
            echo "github=$github"
            echo "npm=$npm"
          } >> "$GITHUB_OUTPUT"

  # Makes the tag at the commit Build ran on, unless it is there already, and
  # names the release with VERSION's second line, or the tag when there is none.
  github:
    name: GitHub
    needs: version
    if: needs.version.outputs.github == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
          run-id: ${{ needs.version.outputs.run }}
          github-token: ${{ github.token }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.title || format('v{0}', needs.version.outputs.version) }}
          target_commitish: ${{ needs.version.outputs.commit }}
          files: bin/*
          generate_release_notes: true

  # The package bindings/javascript describes -- the WebAssembly module, its
  # Node entry, its types and its README -- as Build packed it, named mlatex
  # whatever name a run packed it under. npm refuses that name as too near
  # katex and slate until npm's support allows it, and this step fails until
  # then. The token is the repository's NPM_TOKEN secret; provenance ties the
  # package to this run.
  npm:
    name: npm
    needs: [ version, github ]
    if: >-
      !cancelled() && needs.version.outputs.npm == 'true' &&
      needs.github.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mlatex-wasm
          path: bin
          run-id: ${{ needs.version.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tar -xzf ./bin/*.tgz
          cd package
          npm pkg set name=mlatex
          cat package.json
          npm publish --access public --provenance

  # The same package on GitHub Packages, where the repository's page lists
  # it; GitHub's registry takes a package only under its owner's scope.
  packages:
    name: GitHub Packages
    needs: [ version, github ]
    if: >-
      !cancelled() && needs.version.outputs.ship == 'true' &&
      needs.github.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mlatex-wasm
          path: bin
          run-id: ${{ needs.version.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@modern-latex"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "@modern-latex/mlatex@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@modern-latex/mlatex@$VERSION is on GitHub Packages already."
            exit 0
          fi
          tar -xzf ./bin/*.tgz
          cd package
          npm pkg set name=@modern-latex/mlatex
          npm publish

  # Tells the docs site, modern-latex/docs, that a version is out, so its Reference
  # workflow writes the package reference from the new tag at once rather
  # than at its daily run. The token is the repository's DOCS_TOKEN secret,
  # one allowed to write modern-latex/docs' contents; without it the site still
  # finds the tag on its own within a day.
  docs:
    name: Docs
    needs: [ version, github ]
    runs-on: ubuntu-24.04
    steps:
      - name: Tell the docs site
        env:
          GH_TOKEN: ${{ secrets.DOCS_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::There is no DOCS_TOKEN secret, so the docs site finds $TAG at its daily run."
            exit 0
          fi
          gh api repos/modern-latex/docs/dispatches -f event_type=mlatex-tag -f "client_payload[tag]=$TAG"
          echo "Sent $TAG to modern-latex/docs."

  # Through PyPI's trusted publishing, for this workflow and the `pypi`
  # environment, alongside a new GitHub release. Allowed to fail on its own:
  # until PyPI's mlatex belongs to this project, PyPI refuses the upload, and
  # the release and npm stand without it.
  pypi:
    name: PyPI
    needs: [ version, github ]
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mlatex-*-*
          path: bin
          merge-multiple: true
          run-id: ${{ needs.version.outputs.run }}
          github-token: ${{ github.token }}

      - name: Keep the wheels
        run: mkdir dist && mv bin/*.whl dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
