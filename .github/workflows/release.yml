# Ships what Build made once it has passed on a pushed tag `v*`: every
# package to a GitHub release, then the npm package and the Python wheels,
# both named mlatex. Build packed and tested them in its own run, versioned as
# the tag is, so what is published is what passed.
name: Release

on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]

permissions:
  contents: read
  actions: read

jobs:
  github:
    name: GitHub
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: bin/*
          generate_release_notes: true

  # The package bindings/javascript describes -- the WebAssembly module, its
  # Node entry, its types and its README -- as Build packed it. The token is
  # the repository's NPM_TOKEN secret; provenance ties the package to this run.
  npm:
    name: npm
    needs: github
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mlatex-wasm
          path: bin
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tar -xzOf bin/mlatex-*.tgz package/package.json
          npm publish bin/mlatex-*.tgz --access public --provenance

  # Through PyPI's trusted publishing, for this workflow and the `pypi`
  # environment. Allowed to fail on its own: until PyPI's mlatex belongs to
  # this project, PyPI refuses the upload, and the release and npm stand
  # without it.
  pypi:
    name: PyPI
    needs: github
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mlatex-*-*
          path: bin
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Keep the wheels
        run: mkdir dist && mv bin/*.whl dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
