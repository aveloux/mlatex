# Builds, tests and packages the engine on every platform and architecture
# a release ships for, one runner each: CMake packages the architecture it
# builds, so another architecture is another build -- and the WebAssembly
# module, which runs wherever a browser or Node does, once. Every package is
# versioned as the VERSION file says. A release is release.yml's: once this
# workflow passes on main with a VERSION not yet released, it ships what
# this run packaged.
#
# Every runner gets a C++26 compiler with #embed: Visual Studio's clang-cl on
# Windows, Clang 20 from apt.llvm.org on Linux, Homebrew's LLVM on macOS.
# The Windows runners are the Visual Studio 2026 images: the 2022 ones carry
# Clang 19 and CMake 3.31, which between them cannot ask for C++26 at all.
# vcpkg builds the libraries, cached between runs, and gperf with them.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `wheel` is the Python wheel's platform tag: Ubuntu 24.04's glibc
          # is 2.39, and macOS is built for 14.0.
          - { name: Windows x64, runner: windows-2025-vs2026, triplet: x64-windows, architecture: x64, wheel: win_amd64 }
          - { name: Windows ARM64, runner: windows-11-vs2026-arm, triplet: arm64-windows, architecture: arm64, wheel: win_arm64 }
          - { name: Linux x64, runner: ubuntu-24.04, triplet: x64-linux, architecture: x64, wheel: manylinux_2_39_x86_64 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, triplet: arm64-linux, architecture: arm64, wheel: manylinux_2_39_aarch64 }
          - { name: macOS ARM64, runner: macos-15, triplet: arm64-osx, architecture: arm64, wheel: macosx_14_0_arm64 }
          - { name: macOS x64, runner: macos-15-intel, triplet: x64-osx, architecture: x64, wheel: macosx_14_0_x86_64 }
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      # Use Microsoft's public asset mirror as a fallback when upstream sources (like GNU FTP) time out
      VCPKG_ASSET_SOURCES: "clear;x-azurl,https://msinternal.blob.core.windows.net/vcpkg-mirror/,read"
      TREE: ${{ github.workspace }}/cmake-build-release

    steps:
      - uses: actions/checkout@v7

      # Cache both binary builds AND downloaded source archives (gperf, zlib, etc.)
      - name: Cache vcpkg's builds and downloads
        uses: actions/cache@v6
        with:
          path: |
            .vcpkg
            .vcpkg-downloads
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      # Install system tools required by vcpkg to build autotools ports like gperf
      - name: Install system build dependencies for vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y autoconf autoconf-archive automake libtool
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install autoconf autoconf-archive automake libtool
          fi

      # A vcpkg of its own: not every runner image carries one.
      - name: Install the libraries
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_DOWNLOADS"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
            suffix=".exe"
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi

          # On macOS the libraries are built for the same 14.0 the engine is,
          # not for the runner's own version: a library built for a newer
          # macOS than its program draws a linker warning for every object in
          # it, in every one of the tests, and runs on fewer machines. vcpkg's
          # own triplet is read in, not edited -- an overlay of the same name
          # includes it and adds the one line -- since where it lives is
          # vcpkg's business: x64-osx is a community triplet, arm64-osx not.
          overlay=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            triplet=$(find "$RUNNER_TEMP/vcpkg/triplets" -name "${{ matrix.triplet }}.cmake" | head -n 1)
            if [ -z "$triplet" ]; then
              echo "vcpkg has no triplet named ${{ matrix.triplet }}"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/triplets"
            printf 'include("%s")\nset(VCPKG_OSX_DEPLOYMENT_TARGET 14.0)\n' "$triplet" \
              > "$RUNNER_TEMP/triplets/${{ matrix.triplet }}.cmake"
            overlay=(--overlay-triplets="$RUNNER_TEMP/triplets")
          fi

          # Retry loop: Attempt vcpkg install up to 5 times if network drops or mirrors time out
          for i in {1..5}; do
            echo "Attempt $i to install libraries via vcpkg..."
            if "$RUNNER_TEMP/vcpkg/vcpkg" install --triplet ${{ matrix.triplet }} "${overlay[@]}" \
                harfbuzz libpng libjpeg-turbo libwebp zlib gperf; then
              break
            fi
          
            if [ $i -eq 5 ]; then
              echo "vcpkg install failed after 5 attempts."
              exit 1
            fi
            echo "Download or build failed. Retrying in 15 seconds..."
            sleep 15
          done

          # Not VCPKG_ROOT: loading Visual Studio's environment below points
          # that at the vcpkg Visual Studio ships, which holds none of these
          # libraries, and the configure would look there instead.
          echo "TOOLCHAIN=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "GPERF=$RUNNER_TEMP/vcpkg/installed/${{ matrix.triplet }}/tools/gperf/gperf$suffix" >> "$GITHUB_ENV"

      # WiX 7 for the .msi, with its EULA accepted for this runner and the
      # extensions CPack's installer uses. Accepting it is the project's
      # choice, made here: see https://docs.firegiant.com/wix/osmf/.
      - name: Set up WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/7.0.0
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Util.wixext/7.0.0

      # Visual Studio's clang-cl, and its environment for every step after
      # this one: what vcvarsall sets or changes -- the headers, libraries
      # and tools on the path -- as a Developer Command Prompt would have it.
      # Done here rather than through an action, none of which runs on
      # Node.js 24.
      - name: Load Visual Studio's clang-cl and environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $studio = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          $machine = if ("${{ matrix.architecture }}" -eq "arm64") { "ARM64" } else { "x64" }
          "COMPILER=$studio\VC\Tools\Llvm\$machine\bin\clang-cl.exe" | Out-File $env:GITHUB_ENV -Append
          "CCOMPILER=$studio\VC\Tools\Llvm\$machine\bin\clang-cl.exe" | Out-File $env:GITHUB_ENV -Append

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $after = cmd /c "`"$studio\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.architecture }} > nul && set"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($line in $after) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append
            }
          }

      - name: Set up Clang 20
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y ninja-build rpm
          echo "COMPILER=clang++-20" >> "$GITHUB_ENV"
          echo "CCOMPILER=clang-20" >> "$GITHUB_ENV"

      - name: Set up Homebrew's LLVM
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja
          echo "COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "CCOMPILER=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"

      # In PowerShell on Windows, where Git Bash's own tools would stand in
      # front of Visual Studio's on the path.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B "$env:TREE" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$env:CCOMPILER" `
            "-DCMAKE_CXX_COMPILER=$env:COMPILER" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:TOOLCHAIN" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            "-DGPERF_EXECUTABLE=$env:GPERF"

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Fixes LLVM macOS 26.0 deployment target bugs
            export MACOSX_DEPLOYMENT_TARGET=14.0
            EXTRA_ARGS+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0")
            # Fixes Homebrew LLVM size_t and stdio/math include order bugs
            EXTRA_ARGS+=("-DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)")
          fi

          cmake -B "$TREE" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CCOMPILER" \
            -DCMAKE_CXX_COMPILER="$COMPILER" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DGPERF_EXECUTABLE="$GPERF" \
            "${EXTRA_ARGS[@]}"

      - name: Build
        run: cmake --build "${{ env.TREE }}"

      - name: Test
        run: ctest --test-dir "${{ env.TREE }}" --output-on-failure --timeout 300

      # The sample paper, set by the program just built: the PDF to open and
      # look at, kept with every run and attached to every release.
      - name: Set the sample paper
        if: matrix.name == 'Windows x64'
        shell: bash
        run: '"$TREE/mlatex" --file-line-error --output-directory bin build/main.mtex'

      - name: Keep the sample paper
        if: matrix.name == 'Windows x64'
        uses: actions/upload-artifact@v7
        with:
          name: main.pdf
          path: bin/main.pdf
          if-no-files-found: error

      # Every package lands in bin/, as it does on a person's machine.
      - name: Package
        run: cpack --config "${{ env.TREE }}/CPackConfig.cmake"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The C library as the Python package mlatex: the installed copy's
      # latex_ffi -- with vcpkg's DLLs beside it on Windows -- and its assets,
      # in the package's folder, where the library finds them. ctypes loads
      # it, so one wheel serves every Python on the system. Its version is
      # VERSION's, as everything's is. A wheel that fails is left out rather
      # than holding back the release, as PyPI is.
      - name: Make the Python wheel
        continue-on-error: true
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          cmake --install "$TREE" --prefix stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp stage/bin/*.dll bindings/python/mlatex
          else
            cp stage/lib/liblatex_ffi.* bindings/python/mlatex
          fi
          cp -R stage/assets bindings/python/mlatex
          cp LICENSE bindings/python
          python -m pip install build wheel
          MLATEX_VERSION="$version" python -m build --wheel --outdir wheel bindings/python
          python -m wheel tags --platform-tag ${{ matrix.wheel }} --remove wheel/*.whl
          mv wheel/*.whl bin/

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: mlatex-${{ runner.os }}-${{ matrix.architecture }}
          path: |
            bin/*.msi
            bin/*.zip
            bin/*.dmg
            bin/*.pkg
            bin/*.deb
            bin/*.rpm
            bin/*.tar.gz
            bin/*.whl
            bin/*.pdf
          if-no-files-found: error

  # The engine as a WebAssembly module -- latex.js, latex.wasm and latex.data,
  # the last the fonts -- for a web page, a worker or Node: one build, whatever
  # runs it. Emscripten is pinned to the release the module was built and
  # checked with; gperf is a tool the build runs, so it is the runner's own.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      TREE: ${{ github.workspace }}/cmake-build-wasm

    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg's builds and downloads
        uses: actions/cache@v6
        with:
          path: |
            .vcpkg
            .vcpkg-downloads
          key: vcpkg-wasm32-emscripten-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: vcpkg-wasm32-emscripten-

      - name: Install Emscripten and the libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf ninja-build autoconf autoconf-archive automake libtool
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install --triplet wasm32-emscripten harfbuzz libpng libjpeg-turbo libwebp zlib

          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake -B "$TREE" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DGPERF_EXECUTABLE="$(command -v gperf)"

      - name: Build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --build "$TREE" --target wasm

      # What a page would call, through the module's own JavaScript: a
      # snippet, cropped to the formula, and a document, on a sheet.
      - name: Test
        shell: bash
        working-directory: ${{ env.TREE }}
        run: |
          node -e '
            require("./latex.js")().then((engine) => {
              const session = new engine.Session();
              const check = (made, pdf, sheet, what) => {
                const text = Buffer.from(pdf).toString("latin1");
                if (!made || !text.startsWith("%PDF-") || text.includes("/MediaBox [0 0 612 792]") !== sheet) {
                  console.error(what + " failed:\n" + session.error());
                  process.exit(1);
                }
                console.log(what + ": " + pdf.length + " bytes");
              };
              check(session.snippet("\\[ e^{i\\pi} + 1 = 0 \\]"), session.pdf(), false, "a snippet");
              check(session.typeset("\\documentclass{article}\\begin{document}Hello.\\end{document}"),
                    session.pdf(), true, "a document");
              session.delete();
            });
          '

      - name: Package
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p bin
          (cd "$TREE" && zip -j "$GITHUB_WORKSPACE/bin/mlatex-$version-wasm.zip" latex.js latex.wasm latex.data)

      # The same three files as the npm package mlatex, with its Node entry
      # and types, versioned like the wheels. It is installed somewhere else
      # and run from there, since in Node the module finds latex.data from
      # where the program runs unless the package's entry says otherwise.
      - name: Pack the npm package
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          cp "$TREE/latex.js" "$TREE/latex.wasm" "$TREE/latex.data" LICENSE bindings/javascript
          (cd bindings/javascript && npm version "$version" --no-git-tag-version --allow-same-version &&
            npm pack --pack-destination "$GITHUB_WORKSPACE/bin")
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/bin/mlatex-*.tgz
          node -e '
            require("mlatex")().then((engine) => {
              const session = new engine.Session();
              if (!session.snippet("\\[ e^{i\\pi} + 1 = 0 \\]")) {
                console.error("the package failed:\n" + session.error());
                process.exit(1);
              }
              console.log("the package: " + session.pdf().length + " bytes");
              session.delete();
            });
          '

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: mlatex-wasm
          path: |
            bin/*.zip
            bin/*.tgz
          if-no-files-found: error
